server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/infotact_foodapp}
spring.data.mongodb.database=${MONGODB_DATABASE:infotact_foodapp}

# JWT Configuration
# IMPORTANT: Set APP_JWT_SECRET as an environment variable. Never hardcode it.
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# WebSocket
spring.websocket.enabled=true

# Logging
logging.level.com.infotact=INFO
logging.level.org.springframework.data.mongodb=WARN
